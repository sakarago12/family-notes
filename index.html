<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://api.github.com; img-src data:; form-action 'none'; base-uri 'none'">
<title>우리집 진료수첩</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --text:#1d2330; --sub:#667085; --line:#e4e7ec;
  --pri:#2f6fed; --pri-soft:#e8f0fe; --ok:#12805c; --warn:#b54708; --warn-soft:#fef0e6;
  --danger:#c4320a; --chip:#eef1f5; --shadow:0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1b2027; --text:#e7eaf0; --sub:#98a2b3; --line:#2c333d;
    --pri:#6e9bff; --pri-soft:#1f2b45; --ok:#4cc38a; --warn:#f2a36b; --warn-soft:#3a2a1d;
    --danger:#ff7b5c; --chip:#252c35; --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 96px}

#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.lockbox{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px;box-shadow:var(--shadow)}
.lockbox h1{font-size:22px;margin:0 0 4px}
.lockbox p{color:var(--sub);margin:0 0 16px;font-size:14px}
label{display:block;font-size:13px;color:var(--sub);margin:14px 0 4px}
.err{color:var(--danger);font-size:14px;min-height:20px;margin-top:10px;white-space:pre-line}
.hint{color:var(--sub);font-size:12.5px;margin-top:4px}

input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
textarea{min-height:110px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 16px;background:var(--chip);font-weight:600}
.btn.pri{background:var(--pri);color:#fff}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn.block{width:100%;margin-top:18px;padding:13px}
.btn:disabled{opacity:.5}

header{position:sticky;top:0;z-index:5;background:var(--bg);padding-top:env(safe-area-inset-top)}
.top{display:flex;align-items:center;gap:6px;padding:12px 0 8px}
.top h1{font-size:18px;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--chip);color:var(--sub);white-space:nowrap}
.status.ok{color:var(--ok)} .status.bad{color:var(--danger);background:var(--warn-soft);cursor:pointer}
.icon{background:transparent;border:0;font-size:20px;padding:4px 6px;line-height:1}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;white-space:nowrap;font-size:14px}
.chips .chip{flex:1;padding:6px 8px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tab{flex:1;background:transparent;border:0;padding:10px 4px;color:var(--sub);font-weight:700;border-bottom:2px solid transparent}
.tab.on{color:var(--pri);border-bottom-color:var(--pri)}

h2{font-size:14px;margin:22px 0 8px;color:var(--sub)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer}
.card.past{opacity:.6}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.title{font-weight:700}
.meta{color:var(--sub);font-size:13px}
.body{font-size:14.5px;margin-top:4px;white-space:pre-wrap;word-break:break-word}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--pri-soft);color:var(--pri);font-weight:600;white-space:nowrap}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.empty{color:var(--sub);text-align:center;padding:36px 0;font-size:14px}
.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(20px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;
  border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}

#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){#modal{align-items:center}.sheet{border-radius:16px}}
.sheet h3{margin:0;font-size:18px}
.who{display:flex;gap:6px;flex-wrap:wrap}
.who .chip{padding:7px 14px}
.actions{display:flex;gap:8px;margin-top:20px}
.actions .btn{flex:1}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:9px 16px;border-radius:10px;font-size:14px;z-index:30;max-width:90vw}
</style>
</head>
<body>

<div id="lock"><div class="lockbox" id="lockbox"><p>불러오는 중…</p></div></div>

<div id="app" class="hidden">
  <header>
    <div class="wrap" style="padding-bottom:0">
      <div class="top">
        <h1>🩺 우리집 진료수첩</h1>
        <span id="status" class="status">-</span>
        <button class="icon" id="btnSettings" aria-label="설정">⚙️</button>
        <button class="icon" id="btnLock" aria-label="잠그기">🔒</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="tabs" id="tabs">
        <button class="tab" data-tab="visits">🏥 진료</button>
        <button class="tab" data-tab="meds">💊 약</button>
      </div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
  <button class="fab" id="fab" aria-label="추가">＋</button>
</div>

<div id="modal" class="hidden"><div class="sheet" id="sheet"></div></div>

<script>
'use strict';
/* ===== 설정 ===== */
const FAMILY = ['나', '아내', '장모님', '형님', '아빠'];
const CONF = (() => {
  const host = location.hostname, gh = host.endsWith('.github.io');
  return { owner: gh ? host.split('.')[0] : 'sakarago12',
           repo: gh ? location.pathname.split('/').filter(Boolean)[0] : 'REPO_NAME',
           branch: 'main', path: 'data.enc.json' };
})();
const MOCK = !location.hostname.endsWith('.github.io');   // 로컬 테스트용 가짜 저장소
const ITER = 600000, IDLE_LOCK_MS = 10 * 60 * 1000, LS_CACHE = 'hl_cache';

/* ===== 유틸 ===== */
const $ = s => document.querySelector(s);
const enc = new TextEncoder(), dec = new TextDecoder();
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => [...crypto.getRandomValues(new Uint8Array(12))].map(b => b.toString(16).padStart(2,'0')).join('');
const today = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const dday = s => Math.round((new Date(s + 'T00:00:00') - new Date(today() + 'T00:00:00')) / 86400000);
const fmt = s => s ? s.slice(2).replace(/-/g, '.') : '';
function b64(u8){ let s=''; for(let i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }

/* ===== 암호화 (AES-256-GCM, 비밀번호 → PBKDF2-SHA256) ===== */
async function deriveKey(pw, salt, iter){
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
async function encryptObj(obj){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM', iv}, S.key, enc.encode(JSON.stringify(obj))));
  return {v:1, kdf:'PBKDF2-SHA256', iter:S.iter, salt:b64(S.salt), iv:b64(iv), ct:b64(ct)};
}
async function decryptBlob(blob, key){
  return JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(blob.iv)}, key, unb64(blob.ct))));
}

/* ===== GitHub 저장 ===== */
const API = `https://api.github.com/repos/${CONF.owner}/${CONF.repo}/contents/${CONF.path}`;
function headers(){ const t = S.data?.settings?.token; return t ? {'Accept':'application/vnd.github+json', Authorization:'Bearer '+t} : {'Accept':'application/vnd.github+json'}; }
async function remoteGet(){
  if (MOCK){ const r = lsGet('hl_mock_remote'); return r ? JSON.parse(r) : null; }
  const res = await fetch(API + '?ref=' + CONF.branch, {headers:headers(), cache:'no-store'});
  if (res.status === 404) return null;
  if (!res.ok){ const e = new Error('GET ' + res.status); e.status = res.status; throw e; }
  const j = await res.json();
  return { blob: JSON.parse(atob(j.content.replace(/\s/g,''))), sha: j.sha };
}
async function remotePut(blob, sha){
  if (MOCK){
    const cur = lsGet('hl_mock_remote');
    if ((cur ? JSON.parse(cur).sha : null) !== (sha||null)){ const e = new Error('conflict'); e.status = 409; throw e; }
    const ns = uid(); lsSet('hl_mock_remote', JSON.stringify({blob, sha:ns})); return ns;
  }
  const body = {message:'update', content:btoa(JSON.stringify(blob)), branch:CONF.branch};
  if (sha) body.sha = sha;
  const res = await fetch(API, {method:'PUT', headers:{...headers(),'Content-Type':'application/json'}, body:JSON.stringify(body)});
  if (!res.ok){ const e = new Error('PUT ' + res.status); e.status = res.status; throw e; }
  return (await res.json()).content.sha;
}

/* ===== 데이터 / 동기화 ===== */
const S = { key:null, salt:null, iter:ITER, data:null, sha:null, dirty:false, syncing:false, again:false, who:'all', tab:'visits' };
const emptyData = () => ({version:2, settings:{token:'', updatedAt:0}, visits:[], meds:[]});
const live = k => S.data[k].filter(x => !x.deleted);

function mergeData(a, b){
  const out = emptyData();
  for (const k of ['visits','meds']){
    const m = new Map();
    for (const it of [...(a[k]||[]), ...(b[k]||[])]){ const c = m.get(it.id); if (!c || (it.updatedAt||0) > (c.updatedAt||0)) m.set(it.id, it); }
    out[k] = [...m.values()];
  }
  out.settings = (b.settings?.updatedAt||0) > (a.settings?.updatedAt||0) ? b.settings : a.settings;
  return out;
}
async function saveLocal(){ try{ lsSet(LS_CACHE, JSON.stringify({blob: await encryptObj(S.data), dirty:S.dirty})); }catch(e){} }
function setStatus(kind, text){ const el = $('#status'); el.className = 'status ' + kind; el.textContent = text; el.onclick = kind === 'bad' ? () => sync() : null; }
function errText(e){
  if (e.status === 401 || e.status === 403) return '토큰 오류 ⟳';
  if (e.status === 404) return '저장소 권한 없음 ⟳';
  return '오프라인 · 재시도';
}
function pwChanged(){ alert('다른 기기에서 비밀번호가 바뀌었어요.\n새 비밀번호로 다시 열어주세요.'); lockNow(); }

async function sync(){
  if (S.syncing){ S.again = true; return; }
  S.syncing = true; setStatus('', '저장 중…');
  try{
    for (let i = 0; i < 4; i++){
      const r = await remoteGet();
      if (r){
        if (r.blob.salt !== b64(S.salt)) return pwChanged();
        S.data = mergeData(S.data, await decryptBlob(r.blob, S.key));
      }
      try{
        S.sha = await remotePut(await encryptObj(S.data), r ? r.sha : null);
        S.dirty = false; await saveLocal(); setStatus('ok', '저장됨 ✓'); render(); return;
      }catch(e){ if (e.status === 409 || e.status === 422) continue; throw e; }
    }
    throw new Error('retry');
  }catch(e){
    setStatus('bad', errText(e));
    if ((e.status === 401 || e.status === 403) && !S.warned){ S.warned = true; toast('GitHub 토큰을 확인해주세요 (⚙️ 설정)'); }
  }finally{
    S.syncing = false;
    if (S.again){ S.again = false; if (S.dirty) sync(); }
  }
}
async function pull(){
  if (S.dirty) return sync();
  if (S.syncing) return;
  try{
    const r = await remoteGet(); if (!r) return;
    if (r.blob.salt !== b64(S.salt)) return pwChanged();
    S.data = mergeData(S.data, await decryptBlob(r.blob, S.key)); S.sha = r.sha;
    await saveLocal(); setStatus('ok', '저장됨 ✓'); render();
  }catch(e){ setStatus('bad', errText(e)); }
}
function upsert(col, obj){
  obj.updatedAt = Date.now();
  const i = S.data[col].findIndex(x => x.id === obj.id);
  if (i >= 0) S.data[col][i] = obj; else S.data[col].push(obj);
  S.dirty = true; saveLocal(); render(); sync();
}
function remove(col, id){ upsert(col, {id, deleted:true}); }

/* ===== 잠금 / 처음 설정 ===== */
let REMOTE = null, CACHE = null;
async function boot(){
  try{ CACHE = JSON.parse(lsGet(LS_CACHE) || 'null'); }catch(e){}
  let offline = false;
  try{ REMOTE = await remoteGet(); }catch(e){ offline = true; }
  if (!REMOTE && !CACHE) return offline ? lockMsg('인터넷 연결을 확인한 뒤 새로고침 해주세요.') : showSetup();
  showUnlock(offline);
}
function lockMsg(m){ $('#lockbox').innerHTML = `<h1>🩺 우리집 진료수첩</h1><div class="err">${h(m)}</div>`; }

function showUnlock(offline){
  $('#lockbox').innerHTML = `<h1>🩺 우리집 진료수첩</h1>
    <p>${offline ? '⚠️ 오프라인 — 이 기기에 저장된 사본을 엽니다' : '비밀번호를 입력하세요'}</p>
    <form id="f" autocomplete="off">
      <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password">
      <button class="btn pri block" id="b">열기</button><div class="err" id="err"></div>
    </form>`;
  $('#pw').focus();
  $('#f').onsubmit = async ev => {
    ev.preventDefault(); const pw = $('#pw').value; if (!pw) return;
    $('#b').disabled = true; $('#b').textContent = '여는 중…'; $('#err').textContent = '';
    try{ await unlock(pw); }
    catch(e){ $('#err').textContent = '비밀번호가 맞지 않아요.'; $('#b').disabled = false; $('#b').textContent = '열기'; $('#pw').select(); }
  };
}
async function unlock(pw){
  const main = REMOTE ? REMOTE.blob : CACHE.blob;
  S.salt = unb64(main.salt); S.iter = main.iter || ITER;
  S.key = await deriveKey(pw, S.salt, S.iter);
  S.data = await decryptBlob(main, S.key);
  S.sha = REMOTE?.sha || null;
  if (REMOTE && CACHE?.dirty && CACHE.blob.salt === main.salt){       // 이 기기에서 못 올린 변경분
    try{ S.data = mergeData(S.data, await decryptBlob(CACHE.blob, S.key)); S.dirty = true; }catch(e){}
  }
  REMOTE = CACHE = null;
  enterApp();
  if (S.dirty) sync(); else if (S.sha){ await saveLocal(); setStatus('ok','저장됨 ✓'); } else pull();
}

function showSetup(){
  $('#lockbox').innerHTML = `<h1>🩺 처음 설정</h1>
    <p>아내와 함께 쓸 비밀번호를 정해주세요.</p>
    <form id="f" autocomplete="off">
      <label>비밀번호 (10자 이상)</label><input type="password" id="p1" autocomplete="new-password">
      <label>비밀번호 확인</label><input type="password" id="p2" autocomplete="new-password">
      <div class="hint">⚠️ 잊으면 기록을 복구할 수 없어요.</div>
      <label>GitHub 토큰${MOCK ? ' (로컬 테스트: 아무 값)' : ''}</label><input type="password" id="tk" placeholder="github_pat_…">
      <div class="hint">한 번만 입력하면 돼요. 암호화되어 저장되므로 아내 폰에선 비밀번호만 있으면 됩니다.</div>
      <button class="btn pri block" id="b">시작하기</button><div class="err" id="err"></div>
    </form>`;
  $('#f').onsubmit = async ev => {
    ev.preventDefault();
    const p1 = $('#p1').value, p2 = $('#p2').value, tk = $('#tk').value.trim(), err = m => $('#err').textContent = m;
    if (p1.length < 10) return err('비밀번호는 10자 이상으로 해주세요.');
    if (p1 !== p2) return err('비밀번호 확인이 일치하지 않아요.');
    if (!tk) return err('GitHub 토큰을 입력해주세요.');
    $('#b').disabled = true; $('#b').textContent = '암호화 중…';
    S.salt = crypto.getRandomValues(new Uint8Array(16)); S.iter = ITER;
    S.key = await deriveKey(p1, S.salt, ITER);
    S.data = emptyData(); S.data.settings = {token:tk, updatedAt:Date.now()};
    try{
      S.sha = await remotePut(await encryptObj(S.data), null);
      await saveLocal(); enterApp(); setStatus('ok','저장됨 ✓'); toast('설정 완료!');
    }catch(e){
      $('#b').disabled = false; $('#b').textContent = '시작하기';
      err(e.status === 401 || e.status === 403 ? '토큰이 올바르지 않거나 권한이 부족해요.\n(Contents: Read and write 필요)'
        : e.status === 404 ? '저장소를 찾을 수 없어요. 토큰의 저장소 권한을 확인해주세요.' : '저장 실패: ' + e.message);
    }
  };
}
function lockNow(){ S.key = S.data = null; location.reload(); }

/* ===== 화면 ===== */
let idle;
function resetIdle(){ clearTimeout(idle); idle = setTimeout(lockNow, IDLE_LOCK_MS); }
function enterApp(){
  $('#lock').classList.add('hidden'); $('#app').classList.remove('hidden');
  $('#tabs').onclick = e => { const t = e.target.closest('.tab'); if (t){ S.tab = t.dataset.tab; render(); scrollTo(0,0); } };
  $('#chips').onclick = e => { const c = e.target.closest('.chip'); if (c){ S.who = c.dataset.who; render(); } };
  $('#fab').onclick = () => { const who = S.who === 'all' ? '' : S.who; S.tab === 'meds' ? editMed({who}) : editVisit({who}); };
  $('#btnLock').onclick = lockNow;
  $('#btnSettings').onclick = openSettings;
  ['click','keydown','touchstart','scroll'].forEach(ev => addEventListener(ev, resetIdle, {passive:true}));
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S.key) pull(); });
  addEventListener('online', () => { if (S.dirty) sync(); });
  resetIdle(); render();
}

const mine = arr => S.who === 'all' ? arr : arr.filter(x => x.who === S.who);
const whoBadge = x => S.who === 'all' ? `<span class="badge">${h(x.who)}</span>` : '';

function render(){
  if (!S.data) return;
  $('#chips').innerHTML = ['all', ...FAMILY].map(n => `<button class="chip ${S.who===n?'on':''}" data-who="${h(n)}">${n==='all'?'전체':h(n)}</button>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.tab === S.tab));
  $('#main').innerHTML = S.tab === 'meds' ? viewMeds() : viewVisits();
  $('#main').querySelectorAll('[data-v]').forEach(el => el.onclick = () => editVisit({...S.data.visits.find(x => x.id === el.dataset.v)}));
  $('#main').querySelectorAll('[data-m]').forEach(el => el.onclick = () => editMed({...S.data.meds.find(x => x.id === el.dataset.m)}));
}

function viewVisits(){
  const t = today(), all = mine(live('visits'));
  const next = all.filter(v => v.next && v.next >= t).sort((a,b) => a.next.localeCompare(b.next));
  const list = all.sort((a,b) => (b.date||'').localeCompare(a.date||''));
  let html = '';
  if (next.length){
    html += `<h2>📅 다가오는 예약</h2>` + next.map(v => { const d = dday(v.next);
      return `<div class="card" data-v="${h(v.id)}"><div class="row"><span class="badge warn">${d ? 'D-'+d : '오늘'}</span>
        <b>${fmt(v.next)}</b><span class="grow">${h(v.place)}</span>${whoBadge(v)}</div></div>`; }).join('');
    html += `<h2>지난 진료</h2>`;
  }
  if (!list.length) return html + `<div class="empty">아직 진료 기록이 없어요.<br>＋ 버튼으로 추가하세요.</div>`;
  return html + list.map(v => `<div class="card" data-v="${h(v.id)}">
    <div class="row"><span class="meta">${fmt(v.date)}</span>${whoBadge(v)}<span class="title grow">${h(v.place)}</span></div>
    ${v.note ? `<div class="body">${h(v.note.length > 90 ? v.note.slice(0,90) + '…' : v.note)}</div>` : ''}</div>`).join('');
}

function viewMeds(){
  const all = mine(live('meds')).sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
  const now = all.filter(m => !m.done), past = all.filter(m => m.done);
  const card = m => `<div class="card ${m.done?'past':''}" data-m="${h(m.id)}">
    <div class="row"><span class="title grow">${h(m.name)}</span>${whoBadge(m)}</div>
    ${m.how ? `<div class="body">${h(m.how)}</div>` : ''}</div>`;
  if (!all.length) return `<div class="empty">등록된 약이 없어요.<br>＋ 버튼으로 추가하세요.</div>`;
  return `<h2>지금 먹는 약 (${now.length})</h2>` + (now.length ? now.map(card).join('') : `<div class="empty">없음</div>`)
    + (past.length ? `<h2>예전에 먹은 약</h2>` + past.map(card).join('') : '');
}

/* ===== 입력 ===== */
function whoPicker(cur){ return `<label>누구</label><div class="who" id="who">${FAMILY.map(n => `<button type="button" class="chip ${cur===n?'on':''}" data-n="${h(n)}">${h(n)}</button>`).join('')}</div>`; }
function openSheet(title, obj, col, inner, read){
  $('#sheet').innerHTML = `<h3>${h(title)}</h3><form id="ff">${whoPicker(obj.who)}${inner}<div class="err" id="ferr"></div>
    <div class="actions">${obj.id ? '<button type="button" class="btn danger" id="del">삭제</button>' : ''}
    <button type="button" class="btn" id="cancel">취소</button><button class="btn pri">저장</button></div></form>`;
  $('#modal').classList.remove('hidden');
  let who = obj.who || '';
  $('#who').onclick = e => { const c = e.target.closest('.chip'); if (!c) return; who = c.dataset.n; $('#who').querySelectorAll('.chip').forEach(x => x.classList.toggle('on', x === c)); };
  $('#cancel').onclick = closeModal;
  if (obj.id) $('#del').onclick = () => { if (confirm('삭제할까요?')){ remove(col, obj.id); closeModal(); toast('삭제했어요'); } };
  $('#ff').onsubmit = ev => {
    ev.preventDefault();
    const msg = !who ? '누구 기록인지 선택해주세요.' : read();
    if (msg) return $('#ferr').textContent = msg;
    obj.who = who; if (!obj.id) obj.id = uid();
    upsert(col, obj); closeModal(); toast('저장했어요');
  };
}
function closeModal(){ $('#modal').classList.add('hidden'); $('#sheet').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });

function editVisit(v){
  const places = [...new Set(live('visits').map(x => x.place).filter(Boolean))];
  openSheet(v.id ? '진료 기록 수정' : '진료 기록 추가', v, 'visits', `
    <label>날짜</label><input type="date" id="date" value="${h(v.date || today())}">
    <label>병원</label><input type="text" id="place" value="${h(v.place)}" placeholder="예: 서울내과 (내과)" list="pl">
    <datalist id="pl">${places.map(p => `<option value="${h(p)}">`).join('')}</datalist>
    <label>진료 내용</label><textarea id="note" placeholder="예: 기침·미열로 방문. 기관지염 진단, 5일치 약 처방">${h(v.note)}</textarea>
    <label>다음 예약일 (있으면)</label><input type="date" id="next" value="${h(v.next)}">`,
    () => { v.date = $('#date').value; v.place = $('#place').value.trim(); v.note = $('#note').value.trim(); v.next = $('#next').value;
            if (!v.place) return '병원을 입력해주세요.'; });
}
function editMed(m){
  openSheet(m.id ? '약 수정' : '약 추가', m, 'meds', `
    <label>약 이름</label><input type="text" id="name" value="${h(m.name)}" placeholder="예: 아모디핀정 5mg">
    <label>먹는 방법 · 메모</label><textarea id="how" style="min-height:70px" placeholder="예: 아침 1알, 혈압약">${h(m.how)}</textarea>
    <label>상태</label><select id="done"><option value="">지금 먹는 중</option><option value="1" ${m.done?'selected':''}>이제 안 먹음</option></select>`,
    () => { m.name = $('#name').value.trim(); m.how = $('#how').value.trim(); m.done = !!$('#done').value;
            if (!m.name) return '약 이름을 입력해주세요.'; });
}

/* ===== 설정 ===== */
function openSettings(){
  const tok = S.data.settings.token || '';
  $('#sheet').innerHTML = `<h3>⚙️ 설정</h3>
    <label>GitHub 토큰 (현재 ${tok ? h(tok.slice(0,11)) + '…' + h(tok.slice(-4)) : '없음'})</label>
    <div class="row"><input type="password" id="tk" placeholder="만료되면 새 토큰 붙여넣기" class="grow" style="width:auto"><button class="btn" id="tkSave">변경</button></div>
    <label>비밀번호 변경</label>
    <input type="password" id="p1" placeholder="새 비밀번호 (10자 이상)" autocomplete="new-password">
    <input type="password" id="p2" placeholder="새 비밀번호 확인" autocomplete="new-password" style="margin-top:6px">
    <button class="btn" id="pwSave" style="margin-top:6px">비밀번호 변경</button>
    <div class="err" id="err"></div>
    <div class="actions"><button class="btn" id="close">닫기</button></div>`;
  $('#modal').classList.remove('hidden');
  $('#close').onclick = closeModal;
  $('#tkSave').onclick = () => {
    const t = $('#tk').value.trim(); if (!t) return;
    S.data.settings = {token:t, updatedAt:Date.now()}; S.warned = false; S.dirty = true;
    saveLocal(); sync(); closeModal(); toast('토큰을 변경했어요');
  };
  $('#pwSave').onclick = async () => {
    const p1 = $('#p1').value, p2 = $('#p2').value, err = m => $('#err').textContent = m;
    if (p1.length < 10) return err('비밀번호는 10자 이상으로 해주세요.');
    if (p1 !== p2) return err('비밀번호 확인이 일치하지 않아요.');
    if (!confirm('비밀번호를 바꿀까요? 아내 폰에서도 새 비밀번호를 써야 해요.')) return;
    $('#pwSave').disabled = true;
    const old = {salt:S.salt, key:S.key};
    try{
      const r = await remoteGet();
      if (r) S.data = mergeData(S.data, await decryptBlob(r.blob, S.key));
      S.salt = crypto.getRandomValues(new Uint8Array(16)); S.iter = ITER;
      S.key = await deriveKey(p1, S.salt, ITER);
      S.sha = await remotePut(await encryptObj(S.data), r?.sha || null);
      S.dirty = false; await saveLocal(); closeModal(); toast('비밀번호를 바꿨어요'); setStatus('ok','저장됨 ✓');
    }catch(e){ S.salt = old.salt; S.key = old.key; err('변경 실패: ' + errText(e)); $('#pwSave').disabled = false; }
  };
}

boot();
</script>
